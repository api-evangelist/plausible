aid: plausible
name: Plausible
description: >-
  Plausible is an open source, privacy-friendly web analytics platform designed as a lightweight alternative to Google
  Analytics. It provides essential website traffic metrics without using cookies or collecting personal data, making it
  compliant with GDPR, CCPA, and other privacy regulations out of the box. It can be self-hosted or used as a cloud
  service.
type: Index
accessModel:

naftiko: 1.0.0-alpha2
info:
  label: Plausible Sites API — Guests
  description: 'Plausible Sites API — Guests. 3 operations. Lead operation: List guests/invitations. Self-contained Naftiko
    capability covering one Plausible business surface.'
  tags:
  - Plausible
  - Guests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PLAUSIBLE_API_KEY: PLAUSIBLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-guests
    baseUri: https://plausible.io
    description: Plausible Sites API — Guests business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-sites-guests
      path: /api/v1/sites/guests
      operations:
      - name: listguests
        method: GET
        description: List guests/invitations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upsertguest
        method: PUT
        description: Invite or manage guest access
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-sites-guests-email
      path: /api/v1/sites/guests/{email}
      operations:
      - name: deleteguest
        method: DELETE
        description: Remove guest or invitation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PLAUSIBLE_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-guests-rest
    port: 8080
    description: REST adapter for Plausible Sites API — Guests. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v1/sites/guests
      name: api-v1-sites-guests
      description: REST surface for api-v1-sites-guests.
      operations:
      - method: GET
        name: listguests
        description: List guests/invitations
        call: sites-guests.listguests
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: upsertguest
        description: Invite or manage guest access
        call: sites-guests.upsertguest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sites/guests/{email}
      name: api-v1-sites-guests-email
      description: REST surface for api-v1-sites-guests-email.
      operations:
      - method: DELETE
        name: deleteguest
        description: Remove guest or invitation
        call: sites-guests.deleteguest
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-guests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Plausible Sites API — Guests. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-guests-invitations
      description: List guests/invitations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-guests.listguests
      outputParameters:
      - type: object
        mapping: $.
    - name: invite-manage-guest-access
      description: Invite or manage guest access
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sites-guests.upsertguest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: remove-guest-invitation
      description: Remove guest or invitation
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: sites-guests.deleteguest
      outputParameters:
      - type: object
        mapping: $.

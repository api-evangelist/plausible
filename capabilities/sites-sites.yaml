naftiko: 1.0.0-alpha2
info:
  label: Plausible Sites API — Sites
  description: 'Plausible Sites API — Sites. 5 operations. Lead operation: List sites. Self-contained Naftiko capability covering
    one Plausible business surface.'
  tags:
  - Plausible
  - Sites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PLAUSIBLE_API_KEY: PLAUSIBLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-sites
    baseUri: https://plausible.io
    description: Plausible Sites API — Sites business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-sites
      path: /api/v1/sites
      operations:
      - name: listsites
        method: GET
        description: List sites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsite
        method: POST
        description: Create site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-sites-site_id
      path: /api/v1/sites/{site_id}
      operations:
      - name: getsite
        method: GET
        description: Get site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatesite
        method: PUT
        description: Update site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletesite
        method: DELETE
        description: Delete site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PLAUSIBLE_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-sites-rest
    port: 8080
    description: REST adapter for Plausible Sites API — Sites. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v1/sites
      name: api-v1-sites
      description: REST surface for api-v1-sites.
      operations:
      - method: GET
        name: listsites
        description: List sites
        call: sites-sites.listsites
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsite
        description: Create site
        call: sites-sites.createsite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sites/{site-id}
      name: api-v1-sites-site-id
      description: REST surface for api-v1-sites-site_id.
      operations:
      - method: GET
        name: getsite
        description: Get site
        call: sites-sites.getsite
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatesite
        description: Update site
        call: sites-sites.updatesite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesite
        description: Delete site
        call: sites-sites.deletesite
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-sites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Plausible Sites API — Sites. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-sites
      description: List sites
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-sites.listsites
      outputParameters:
      - type: object
        mapping: $.
    - name: create-site
      description: Create site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sites-sites.createsite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-site
      description: Get site
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-sites.getsite
      outputParameters:
      - type: object
        mapping: $.
    - name: update-site
      description: Update site
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sites-sites.updatesite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-site
      description: Delete site
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: sites-sites.deletesite
      outputParameters:
      - type: object
        mapping: $.

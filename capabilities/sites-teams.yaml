naftiko: 1.0.0-alpha2
info:
  label: Plausible Sites API — Teams
  description: 'Plausible Sites API — Teams. 1 operations. Lead operation: List teams. Self-contained Naftiko capability covering
    one Plausible business surface.'
  tags:
  - Plausible
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PLAUSIBLE_API_KEY: PLAUSIBLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-teams
    baseUri: https://plausible.io
    description: Plausible Sites API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-sites-teams
      path: /api/v1/sites/teams
      operations:
      - name: listteams
        method: GET
        description: List teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PLAUSIBLE_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-teams-rest
    port: 8080
    description: REST adapter for Plausible Sites API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v1/sites/teams
      name: api-v1-sites-teams
      description: REST surface for api-v1-sites-teams.
      operations:
      - method: GET
        name: listteams
        description: List teams
        call: sites-teams.listteams
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Plausible Sites API — Teams. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-teams
      description: List teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-teams.listteams
      outputParameters:
      - type: object
        mapping: $.

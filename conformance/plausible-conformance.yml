certifications:
  audited: false
  detail: >-
    Plausible claims NO third-party audit certification. SOC 2, ISO 27001, PCI DSS, HIPAA,
    FedRAMP and CSA STAR are absent from both https://plausible.io/compliance and
    https://plausible.io/security (both read 2026-08-13). Its published posture is
    compliance-by-design plus one independent legal review, and it says so openly. That is
    an honest position, not a gap being hidden — but it is materially different from a
    certified posture and is recorded here as such. No security/plausible-trust-center.yml
    is written, because there is no certification set to record.
security_practices_published:
  - {practice: 'TLS 1.2 or newer, TLS 1.3 preferred', source: 'https://plausible.io/security'}
  - {practice: 'AES-256 encrypted backups, 30-day retention, quarterly restore testing', source: 'https://plausible.io/security'}
  - {practice: 'IP and User-Agent hashed daily with a rotating salt, deleted every 24 hours; never stored raw', source: 'https://plausible.io/security'}
  - {practice: 'daily automated dependency scanning and regular vulnerability scans', source: 'https://plausible.io/security'}
  - {practice: 'business continuity and disaster recovery plans, reviewed annually', source: 'https://plausible.io/security'}
  - {practice: 'responsible disclosure program', source: 'https://plausible.io/vulnerability-disclosure-program'}
event_surface_note: >-
  Plausible publishes no webhooks, no callbacks, no streaming endpoint and no AsyncAPI
  document (/docs/webhooks probed 2026-08-13: 404; no webhook reference exists anywhere in
  the docs index). The closest analogue is Enterprise-only "Scheduled raw event exports",
  which is a batch delivery arrangement, not a subscribable event contract. No asyncapi/
  artifact and no Webhooks pointer are emitted — an absent event surface is not penalized
  and must not be fabricated.

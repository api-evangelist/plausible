specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Plausible
providerId: plausible
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Analytics
  - Web Analytics
  - SaaS
  - Privacy
description: FOCUS-aligned FinOps for Plausible Analytics - tiered SaaS subscription gated by monthly
  pageview volume, sites, team members, and API quota. Bills monthly or annually in USD on a single
  invoice line per site/account.
sources:
  - https://plausible.io/#pricing
  - https://plausible.io/docs/stats-api
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Plausible Insights OU
serviceCategory: Analytics
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Plausible Analytics
  ServiceCategory: Analytics
  ServiceSubcategory: Web Analytics
  ProviderName: Plausible
  PublisherName: Plausible Insights OU
  InvoiceIssuerName: Plausible Insights OU
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
  - name: subscription_month
    description: Monthly subscription fee for the chosen tier (Starter / Growth / Business / Enterprise).
    unit: month
    aggregation: sum
    dimensions:
      - plan
      - billing_cycle
  - name: monthly_pageviews_included
    description: Pageviews included in the chosen tier; overage triggers an upgrade rather than
      metered billing.
    unit: pageview
    aggregation: sum
    dimensions:
      - site
      - plan
  - name: sites_included
    description: Number of sites tracked under the account; capped per plan.
    unit: site
    aggregation: count
    dimensions:
      - plan
  - name: team_seats
    description: Number of team members on the account; capped per plan.
    unit: seat
    aggregation: count
    dimensions:
      - plan
  - name: stats_api_calls
    description: Stats API request count; not separately billed but governed by the per-hour quota
      tied to the plan.
    unit: request
    aggregation: sum
    dimensions:
      - api_key
      - plan
principles:
  - name: Visibility
    description: Pageview consumption is visible in the Plausible dashboard; subscription cost is
      visible on the billing page and via Stripe-issued invoices.
  - name: Allocation
    description: Allocate cost per site or per team by tagging Plausible sites to a product/team and
      mapping subscription tier and seat count to the owner.
  - name: Optimization
    description: Right-size the plan to the smallest pageview tier that fits monthly traffic; switch
      to annual billing for the published discount; consolidate sites under one Business plan rather
      than running multiple Starter accounts.
  - name: Accountability
    description: Account owner receives upgrade prompts when pageview limits are exceeded; finance
      and analytics-team owner should jointly review monthly pageview trend versus tier.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

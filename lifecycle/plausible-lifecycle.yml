  sunset_header: false
  deprecation_header: false
  detail: >-
    Plausible publishes NO API deprecation policy. Stats API v1 is described on its own
    docs page as "a legacy feature" with the note "There is a new version of our stats
    API", but no sunset date, no migration window, and no RFC 8594 Sunset/Deprecation
    response headers are published or observed. Because there is no policy page, no
    `Deprecation` pointer is emitted in apis.yml — the label on a single docs page is not a
    deprecation policy.

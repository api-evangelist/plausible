versioning:
  scheme: uri-path
  current: v2
  docs: https://plausible.io/docs/stats-api
  detail: >-
    Version is carried in the path and is per-API rather than provider-wide: Stats API is
    on /api/v2, the Sites API is still on /api/v1, and the ingest endpoint /api/event is
    unversioned. No version header, no date-pinned version, no release train. The
    self-hosted Community Edition is released as MAJOR.MINOR container tags on GitHub.
deprecation:
  policy_url: null

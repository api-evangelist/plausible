      visit:country, visit:device, visit:browser, visit:os, visit:utm_*).
  - tool: get_conversions
    category: analytics-read
    rest: [runQuery]
    binding: rest
    confidence: high
    note: >-
      Preset over POST /api/v2/query selecting conversion metrics (events,
      conversion_rate, group_conversion_rate) with the event:goal dimension.
  - tool: compare_periods
    category: analytics-read

source: >-
  mcp/plausible-mcp.yml (tool names from https://github.com/getsentry/plausible-mcp,
  referenced by https://plausible.io/docs/data-access#mcp-server) bound against the
  operationIds in openapi/*.yml
note: >-
  The MCP surface crosswalked here belongs to a COMMUNITY server (built by Sentry) that
  Plausible's own docs link and explicitly label "not an official Plausible integration".
  It is crosswalked because it is the tool surface agents actually reach Plausible through,
  not because Plausible operates it. Every tool below is backed by exactly one Plausible
  REST operation — runQuery — because the Sentry server is a set of opinionated
  presets over Stats API v2 rather than a projection of the whole API. That is the finding:
  the entire Sites API (site, goal, guest, custom-property, shared-link and team
  management) has NO agent tool at all.
surfaces:
  openapi:

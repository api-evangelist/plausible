method: searched
source: >-
  npm registry (registry.npmjs.org), WordPress.org plugin API, hex.pm API,
  github.com/plausible org listing, and https://plausible.io/docs/plausible-script
note: >-
  Plausible ships very few packaged client libraries. Its primary distribution is a
  CDN-hosted tracker script, not a registry package. The one official npm package,
  plausible-tracker, has an ARCHIVED source repository and its last release predates
  the current Stats API v2 surface — recorded below as a structured currency signal,
  not prose. No first-party Python, Go, Ruby, PHP, Java or .NET client exists; the
  packages that carry those names on the registries are community projects and are
  marked official: false.
packages:
  - language: javascript
    registry: npm
    name: plausible-tracker
    url: https://www.npmjs.com/package/plausible-tracker
    install: npm install plausible-tracker
    official: true
    version: 0.3.9
    published: '2024-05-27'
    repository: https://github.com/plausible/plausible-tracker
    note: >-
      Official frontend tracker published by Plausible. The source repository is ARCHIVED
      on GitHub and the last release (0.3.9, 2024-05-27) predates the plausible.init()
      configuration model documented at /docs/script-extensions and the Stats API v2
      surface. Plausible's own docs now point users at the CDN script rather than this
      package.
  - language: javascript
    registry: cdn
    name: plausible tracker script
    url: https://plausible.io/js/script.js
    install: '<script defer data-domain="yourdomain.com" src="https://plausible.io/js/script.js"></script>'
    official: true
    version: null
    published: null
    note: >-
      The primary official distribution. Probed 2026-08-13: HTTP 200. The URL is UNPINNED
      — it always serves the current build, so a consumer cannot tell which version they
      are running and neither can we. Variant builds also probed 200 on 2026-08-13:
      /js/script.hash.js, /js/script.manual.js, /js/script.tagged-events.js,
      /js/script.revenue.js, /js/script.file-downloads.outbound-links.js. No CDN metadata
      endpoint is served for these paths.
  - language: javascript
    registry: cdn
    name: plausible embed host script
    url: https://plausible.io/js/embed.host.js
    install: '<script async src="https://plausible.io/js/embed.host.js"></script>'
    official: true
    version: null
    published: null
    note: >-
      Loader for embedded shared-link dashboards (see components/plausible-components.yml).
      Probed 2026-08-13: HTTP 200. Unpinned URL, no registry or CDN metadata endpoint.
  - language: php
    registry: wordpress.org
    name: plausible-analytics
    url: https://wordpress.org/plugins/plausible-analytics/
    install: 'WordPress admin > Plugins > Add New > "Plausible Analytics"'
    official: true
    version: 2.6.1
    published: '2026-08-11'
    repository: https://github.com/plausible/wordpress
    note: >-
      Published by Plausible Insights OÜ on WordPress.org; version and date read from the
      WordPress.org plugin info API on 2026-08-13. This is the most actively maintained
      first-party distribution Plausible ships and it is a site-integration plugin, not an
      API client.
  - language: other
    registry: github
    name: plausible-gtm-template
    url: https://github.com/plausible/plausible-gtm-template
